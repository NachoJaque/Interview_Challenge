[tool.ruff]
line-length = 120
target-version = "py313"
# Migration files are generated by Alembic.
extend-exclude = ["alembic/versions/0001_initial_schema.py"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, likely bugs, modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# conftest sets environment variables before importing the app.
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
files = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
