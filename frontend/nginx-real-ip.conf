# Production only (mounted by docker-compose.prod.yml).
#
# Behind Caddy every request reaches nginx from Caddy's address, so the login
# rate limit would count all visitors as one client. This restores the real
# client address from X-Forwarded-For, trusting only Docker's private networks:
# nginx is not reachable from outside, so only Caddy can set that header.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
