# Serves the built React app and forwards /api to the FastAPI container, so
# the browser only ever talks to one origin.

# --- The API upstream -------------------------------------------------------
# Docker's DNS is asked again every few seconds, so when the API container is
# replaced by a deploy (and gets a new address) nginx follows it instead of
# answering 502 until it is restarted. Connections to the API are kept open
# and reused rather than opened for every request.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api_upstream {
    zone api_upstream 64k;
    server api:8000 resolve;
    keepalive 32;
}

# --- Rate limits ------------------------------------------------------------
# Login and sign-up: 20 per minute per client IP, with short bursts allowed.
# These are the only requests that try passwords, so the address is the key.
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

# Every other write (reserve, confirm, cancel, refund): 60 per minute per
# customer. The key is the session token, so customers who share one address
# (an office, a campus, a mobile carrier) do not throttle each other; without
# a token it falls back to the address. Reads have an empty key: not counted.
map $http_authorization $client_identity {
    default $http_authorization;
    ""      $binary_remote_addr;
}
map $request_method $write_limit_key {
    default "";
    POST    $client_identity;
}
limit_req_zone $write_limit_key zone=writes:20m rate=60r/m;

# A ceiling for all API traffic from one address. High, because many customers
# can sit behind one address and every open page polls for availability.
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    # Security headers for every response. (Deliberately no add_header inside
    # the locations below: that would discard these.)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The API sets these too; keep a single copy of each.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    # HSTS belongs to whatever terminates TLS (Caddy in production).
    proxy_hide_header Strict-Transport-Security;

    # HTTP/1.1 with an empty Connection header is what lets upstream
    # connections be reused.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Fail fast when the API is down or restarting, rather than holding the
    # customer for the default minute.
    proxy_connect_timeout 3s;
    proxy_read_timeout 40s;

    location = /api/auth/login {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api_upstream/auth/login;
    }

    location = /api/auth/register {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api_upstream/auth/register;
    }

    # Swagger UI loads its script and styles from a CDN and uses an inline
    # script, so this one page gets a looser policy than the rest of the site.
    # (add_header here replaces the server-level headers, hence the repeats.)
    location = /api/docs {
        proxy_pass http://api_upstream/docs;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /api/ {
        limit_req zone=writes burst=20 nodelay;
        limit_req zone=api burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://api_upstream/;
    }

    # Build output has content hashes in its file names, so it can be cached forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Client-side routing: unknown paths fall back to the app shell.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
