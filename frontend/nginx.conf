# Serves the built React app and forwards /api to the FastAPI container, so
# the browser only ever talks to one origin.

# Brute-force protection for login and sign-up: 20 requests per minute per
# client IP, with short bursts allowed. Excess requests get 429.
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    # Security headers for every response. (Deliberately no add_header inside
    # the locations below: that would discard these.)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The API sets these too; keep a single copy of each.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    # HSTS belongs to whatever terminates TLS (Caddy in production).
    proxy_hide_header Strict-Transport-Security;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/auth/login {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000/auth/login;
    }

    location = /api/auth/register {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000/auth/register;
    }

    # Swagger UI loads its script and styles from a CDN and uses an inline
    # script, so this one page gets a looser policy than the rest of the site.
    # (add_header here replaces the server-level headers, hence the repeats.)
    location = /api/docs {
        proxy_pass http://api:8000/docs;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /api/ {
        proxy_pass http://api:8000/;
    }

    # Build output has content hashes in its file names, so it can be cached forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Client-side routing: unknown paths fall back to the app shell.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
